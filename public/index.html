<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mail Composer</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <h1>Mail Composer</h1>
  <div class="mode-toggle">
    <button id="mode-free" class="mode-btn active">Free-form</button>
    <button id="mode-template" class="mode-btn">Template</button>
  </div>
  <select id="brand" aria-label="Brand"></select>
  <select id="template" aria-label="Template" style="display:none"></select>
</header>
<main>
  <!-- Free-form panel -->
  <div id="panel-free">
    <form id="f" autocomplete="off">
      <label for="to">To</label>
      <input id="to" required placeholder="fan@example.com">
      <div class="row">
        <div><label for="cc">Cc</label><input id="cc" placeholder="optional"></div>
        <div><label for="bcc">Bcc</label><input id="bcc" placeholder="optional"></div>
      </div>
      <label for="subject">Subject</label>
      <input id="subject" required>
      <label for="preheader">Preheader</label>
      <input id="preheader">
      <label for="title">Title</label>
      <input id="title">
      <label for="greeting">Greeting</label>
      <input id="greeting">
      <label for="paragraphs">Body <span class="hint">(blank line = new paragraph)</span></label>
      <textarea id="paragraphs" rows="12"></textarea>
      <div class="row">
        <div><label for="signatureName">Sign-off name</label><input id="signatureName"></div>
        <div><label for="organization">Organization</label><input id="organization"></div>
      </div>
      <div class="actions">
        <button type="submit" id="send">Send</button>
        <button type="button" id="reset">Reset</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </div>

  <!-- Template panel -->
  <div id="panel-template" style="display:none">
    <form id="tf" autocomplete="off">
      <label for="t-to">To</label>
      <input id="t-to" required placeholder="fan@example.com">
      <label for="t-subject">Subject</label>
      <input id="t-subject">
      <div id="t-vars"></div>
      <div class="actions">
        <button type="submit" id="t-send">Send</button>
        <button type="button" id="t-reset">Reset</button>
      </div>
      <div id="t-status" role="status" aria-live="polite"></div>
    </form>
  </div>

  <!-- Preview pane -->
  <div id="preview-pane">
    <div class="preview-toggle">
      <button id="pv-raw" class="pv-btn active">Template</button>
      <button id="pv-inbox" class="pv-btn">Inbox</button>
    </div>
    <iframe id="pv" title="Preview"></iframe>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
