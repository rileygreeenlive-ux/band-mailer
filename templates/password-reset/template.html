{{> header}}
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      Hello {{firstName}},
    </td></tr>
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      Use the button below to set a new password. The link expires in {{expiresIn}}.
    </td></tr>
    <tr><td style="padding:20px 32px 0 32px;">
      <a href="{{resetUrl}}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 22px;border-radius:6px;">Set new password</a>
    </td></tr>
    <tr><td style="padding:16px 32px 0 32px;font-size:13px;line-height:19px;color:#6b7280;">
      Didn't request this? Ignore the email — nothing changes.
    </td></tr>
{{> footer}}
