<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#fbf7ef;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fbf7ef" style="background:#fbf7ef;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:640px;">
        <tr>
          <td style="padding:0 32px;">
            <img src="{{bannerUrl}}" width="576" alt="Big Machine Label Group" style="display:block;width:100%;max-width:576px;height:auto;border:0;outline:none;text-decoration:none;">
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{title}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{greeting}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{intro}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{paymentMethods}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{afterPayment}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{outro}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{signOff}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{signature}}
          </td>
        </tr>
        <tr>
          <td style="padding:26px 32px 40px 32px;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.6;color:#1a1a1a;">
            {{org}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
