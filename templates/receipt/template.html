{{> header}}
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      Hello {{firstName}},
    </td></tr>
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      Receipt for your records.
    </td></tr>
    <tr><td style="padding:16px 32px 0 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#374151;border-top:1px solid #e5e7eb;">
        <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;">Item</td><td align="right" style="padding:10px 0;border-bottom:1px solid #e5e7eb;">{{itemName}}</td></tr>
        <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;">Reference</td><td align="right" style="padding:10px 0;border-bottom:1px solid #e5e7eb;">{{reference}}</td></tr>
        <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;">Paid on</td><td align="right" style="padding:10px 0;border-bottom:1px solid #e5e7eb;">{{paidOn}}</td></tr>
        <tr><td style="padding:10px 0;font-weight:bold;">Total</td><td align="right" style="padding:10px 0;font-weight:bold;">{{amount}}</td></tr>
      </table>
    </td></tr>
{{> footer}}
