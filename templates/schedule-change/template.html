{{> header}}
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      Hello {{firstName}},
    </td></tr>
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      The start time for <strong>{{eventName}}</strong> has changed.
    </td></tr>
    <tr><td style="padding:16px 32px 0 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#374151;border-top:1px solid #e5e7eb;">
        <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;">Was</td><td align="right" style="padding:10px 0;border-bottom:1px solid #e5e7eb;color:#6b7280;">{{oldWhen}}</td></tr>
        <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;">Now</td><td align="right" style="padding:10px 0;border-bottom:1px solid #e5e7eb;font-weight:bold;">{{newWhen}}</td></tr>
      </table>
    </td></tr>
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      {{note}}
    </td></tr>
{{> footer}}
