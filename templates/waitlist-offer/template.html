{{> header}}
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      Hello {{firstName}},
    </td></tr>
    <tr><td style="padding:12px 32px 0 32px;font-size:15px;line-height:22px;color:#374151;">
      You're next on the waitlist for <strong>{{eventName}}</strong>. Claim your place within {{expiresIn}} or it passes to the next person.
    </td></tr>
    <tr><td style="padding:20px 32px 0 32px;">
      <a href="{{claimUrl}}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 22px;border-radius:6px;">Claim place</a>
    </td></tr>
{{> footer}}
